<!doctype html>
<html lang="en">

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>2026 Course Schedule</title>
    <link rel='stylesheet' href='style.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id = "bar" class = "index"></div>
    <div id = "left-bar1"></div>
    <h1 class = "title">Course List</h1>
    <a id = "insertPage" href = "insert.html"><h6>Add Course</h6></a>
    <hr/>
    <div class="container">
        <!-- Category selector (dropdown) -->
        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Category</label>
            </div>
            <div class='col-md-10'>
                <select id='category'>
                    <option value=''>/</option>
                    <option value='GIMM'>GIMM</option>
                    <option value='University Foundations'>University Foundations</option>
                    <option value='Anthropology'>Anthropology</option>
                    <option value='University Foundations'>University Foundations</option>
                    <option value='ITM'>ITM</option>
                    <option value='Math'>Math</option>
                    <option value='Kine'>Kinesiology</option>
                </select>
            </div>
            <div id='invalid-form' class='alert alert-danger'>&nbsp;</div>
            <script>
                let banner = document.getElementById("invalid-form");
                const errorBanner = document.getElementById('invalid-form');
                errorBanner.hidden = true;
            </script>
        </div>

        <!-- Filter by semester options (checkboxes) -->
        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Exclude Spring Courses?</label>
            </div>
            <div class='col-md-10'>
                <input id='spring' type='checkbox' />
            </div>
        </div>

        <!-- Second filter by semester option (checkboxes) -->
        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Exclude Fall Courses?</label>
            </div>
            <div class='col-md-10'>
                <input id='fall' type='checkbox' />
            </div>
            <div id='invalid-form2' class='alert alert-danger'>&nbsp;</div>
            <script>
                let banner2 = document.getElementById("invalid-form2");
                const errorBanner2 = document.getElementById('invalid-form2');
                errorBanner2.hidden = true;
            </script>
        </div>

        <!-- Sort order options (dropdown) -->
        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Sort By Ascending or Descending</label>
            </div>
            <div class='col-md-10'>
                <select id='level'>
                    <option value=''></option>
                    <option value='ASC'>Ascending</option>
                    <option value='DESC'>Descending</option>
                </select>
            </div>
            <div id='invalid-form3' class='alert alert-danger'>&nbsp;</div>
            <script>
                let banner3 = document.getElementById("invalid-form3");
                const errorBanner3 = document.getElementById('invalid-form3');
                errorBanner3.hidden = true;
            </script>
        </div>

        <!-- Course professor filter (textbox) -->
        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Course Professor</label>
            </div>
            <div class='col-md-10'>
                <input id='professor' type='text' />
            </div>
            <div id='invalid-form4' class='alert alert-danger'>&nbsp;</div>
            <script>
                let banner4 = document.getElementById("invalid-form4");
                const errorBanner4 = document.getElementById('invalid-form4');
                errorBanner4.hidden = true;
            </script>
        </div>

        <!-- Search button -->
        <div class='row mb-3'>
            <div class='col-md-12'>
                <button id='search'>Search for Classes</button>
            </div>
        </div>
        <hr/>

    </div>

    <hr />

    <div id='classes' class='overflow'>
        No courses found.
    </div>

    <script>
        const isEmpty = (obj) => Object.keys(obj).length === 0;
        let hasErrors = false;

        document.getElementById('search').addEventListener('click', (event) => {
            const getParameters = {};

            //This is a checkbox
            if (document.querySelector('#spring:checked')) {
                getParameters.spring = 0;
            }

            //Everything else
            if (document.getElementById('professor').value.length !== 0) {
                getParameters.professor = document.getElementById('professor').value;
            }

            if (document.getElementById('category').value.length !== 0) {
                getParameters.category = document.getElementById('category').value;
                console.log(getParameters.category);
            }

            if (document.querySelector('#fall:checked')) {
                getParameters.fall = 0;
            }

            if (document.getElementById('level').value.length !== 0) {
                getParameters.level = document.getElementById('level').value;
            }

            // Error setup
            const errorMessages = document.getElementsByClassName('alert-danger');
            errorBanner.hidden = true;
            errorBanner2.hidden = true;
            errorBanner3.hidden = true;
            errorBanner4.hidden = true;

            for (htmlElement of errorMessages) {
                htmlElement.innerHTML = '&nbsp;';
            }

            if ((document.getElementById('category').value != '') && (document.getElementById('category').value != 'GIMM') && (document.getElementById('category').value != 'Math') && (document.getElementById('category').value != 'University Foundations') && (document.getElementById('category').value != 'ITM') && (document.getElementById('category').value != 'Anthropology') && (document.getElementById('category').value != 'Kinesiology')) {
                errorBanner.innerText = 'Please enter a valid course name.';
                errorBanner.hidden = false;
                hasErrors = true;
            }
            if ((document.querySelector('#spring:checked')) && (document.querySelector('#fall:checked'))) {
                errorBanner2.innerText = 'Please allow at least one semester.';
                errorBanner2.hidden = false;
                hasErrors = true;
            }
            if ((document.getElementById('level').value != '') && (document.getElementById('level').value != 'ASC') && (document.getElementById('level').value != 'DESC')) {
                errorBanner3.innerText = 'Please select a valid order method.';
                errorBanner3.hidden = false;
                hasErrors = true;
            }
            if ((document.getElementById('professor').value.length > 255)) {
                errorBanner4.innerText = 'Please enter a valid professor.';
                errorBanner4.hidden = false;
                hasErrors = true;
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'GET'
            };

            //Send FETCH API request
            // fetch("http://localhost/classes/" + (!isEmpty(getParameters) ? '?' + new URLSearchParams(getParameters) : ''), fetchSettings)
            fetch("/classes/" + (!isEmpty(getParameters) ? '?' + new URLSearchParams(getParameters) : ''), fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                        ));
                })

                .then(({ status, json }) => {
                    if (status === 200) {
                        const responseInfo = document.getElementById('container');
                        if (json.data.length > 0) {
                            for (response of json.data) {
                                    'INSERT INTO course_list (action) VALUES ()';
                            }
                        }

                        // Draws table
                        let displayTable = '<table>' +
                            '<thead>' +
                            '<tr>' +
                            '<th width="12.5%">Class</th>' +
                            '<th width="12.5%">Level</th>' +
                            '<th width="12.5%">Professor First Name</th>' +
                            '<th width="12.5%">Professor Last Name</th>' +
                            '<th width="12.5%">Category</th>' +
                            '<th width="12.5%">Semester</th>' +
                            '<th width="12.5%">Credits</th>' +
                            '<th width="12.5%">Action</th>' +
                            '</tr>' +
                            '</thead>' +
                            '<tbody>';
                        if (typeof json.data !== 'undefined') {
                            for (row of json.data) {
                                displayTable += '<tr>' +
                                    '<td>' + row.class + '</td>' +
                                    '<td>' + row.level + '</td>' +
                                    '<td>' + row.first_name + '</td>' +
                                    '<td>' + row.last_name + '</td>' +
                                    '<td>' + row.category + '</td>' +
                                    '<td>' + row.semester + '</td>' +
                                    '<td>' + row.credits + '</td>' +
                                    '<td><a href="edit.html?id=' + row.id + '">Edit</a></td>' +
                                    '</tr>';
                            }
                        }
                        displayTable += '</tbody></table>';
                        document.getElementById('classes').innerHTML = displayTable;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
    <div id = "right-bar1"></div>
</body>

</html>
